; Upload limits for PHP-FPM / CGI hosts (cPanel reads this file; others ignore it).
; Phone photos are 3–12 MB and the common host default of 2 MB discarded them before any
; application code ran ("photos uploaded are not reflecting", 5 Nov 2026). The browser now
; shrinks large photos before sending (photo-upload.js); this is the server half, for
; uploads that arrive without that script. Do NOT put php_value lines in .htaccess instead:
; under PHP-FPM they are a 500 on every page.
upload_max_filesize = 16M
post_max_size = 24M
