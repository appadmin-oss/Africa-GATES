<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</helmet>

<div ref="{{ rootRef }}" dir="{{ dir }}" data-density="{{ density }}" style="position:relative;width:100%;height:{{ h }};aspect-ratio:{{ ratio }};container-type:size;overflow:hidden;border-radius:{{ radius }};background:{{ bg }};font-family:'DM Sans',system-ui,sans-serif;color:#10292c">
  <span aria-hidden="true" style="position:absolute;inset:0;background:{{ pattern }};-webkit-mask-image:{{ mask }};mask-image:{{ mask }}"></span>
  <sc-if value="{{ isGraphic }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ showLogo }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="width:clamp(28px,30cqmin,132px);aspect-ratio:1 / 1;border-radius:clamp(8px,7cqmin,30px);background:#fff;box-shadow:0 1px 0 rgba(16,41,44,.06),0 10px 28px -12px rgba(16,41,44,.35);display:flex;align-items:center;justify-content:center"><sc-if value="{{ hasHostLogo }}" hint-placeholder-val="{{ false }}"><img src="{{ logo }}" alt="" style="width:64%;height:64%;object-fit:contain"></sc-if><sc-if value="{{ noHostLogo }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="{{ ink }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:44%;height:44%;overflow:visible"><path d="{{ glyph }}"></path></svg></sc-if></span></div></sc-if>
    <sc-if value="{{ showDate }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:clamp(8px,6cqmin,24px);inset-inline-start:clamp(8px,6cqmin,24px);display:flex;flex-direction:column;align-items:center;min-width:clamp(38px,20cqmin,84px);padding:clamp(5px,2.6cqmin,12px) clamp(6px,3cqmin,14px) clamp(6px,3.2cqmin,14px);box-sizing:border-box;border-radius:clamp(9px,4.4cqmin,18px);background:#fff;box-shadow:0 8px 20px -12px rgba(16,41,44,.35)"><b style="font-size:clamp(10.5px,5.4cqmin,19px);line-height:1.1;color:{{ ink }}">{{ monthShort }}</b><span style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(19px,13cqmin,52px);line-height:1">{{ day }}</span></span></sc-if>
    <sc-if value="{{ showTitle }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset-inline-start:clamp(10px,6cqmin,28px);bottom:clamp(10px,6cqmin,28px);max-width:72%;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(14px,{{ gTitleK }}cqmin,40px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ title }}</span></sc-if>
    <sc-if value="{{ showPill }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;inset-inline-start:{{ pillX }};top:{{ pillTop }};bottom:{{ pillBottom }};display:flex;align-items:center;gap:6px;height:clamp(22px,9cqmin,34px);padding:0 clamp(8px,3.2cqmin,14px);border-radius:999px;background:#fff;color:{{ ink }};font-weight:700;font-size:clamp(11px,3.9cqmin,14.5px);white-space:nowrap"><span style="width:clamp(6px,1.8cqmin,8px);aspect-ratio:1 / 1;border-radius:50%;background:{{ line }}"></span>{{ label }}</span></sc-if>
  </sc-if>
  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,7cqmin,72px)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="display:flex;align-items:center;gap:7px;height:clamp(22px,8cqmin,52px);padding:0 clamp(8px,2.8cqmin,22px);border-radius:999px;background:#fff;color:{{ ink }};font-weight:700;font-size:clamp(11px,3.4cqmin,22px);white-space:nowrap"><span style="width:clamp(5px,1.5cqmin,11px);aspect-ratio:1 / 1;border-radius:50%;background:{{ line }}"></span>{{ label }}</span>
        <sc-if value="{{ hasHostLogo }}" hint-placeholder-val="{{ false }}"><span style="width:clamp(28px,11cqmin,84px);aspect-ratio:1 / 1;border-radius:clamp(7px,2.6cqmin,20px);background:#fff;display:flex;align-items:center;justify-content:center"><img src="{{ logo }}" alt="" style="width:66%;height:66%;object-fit:contain"></span></sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:clamp(6px,2.4cqmin,20px);max-width:{{ textMax }}">
        <sc-if value="{{ hasDate }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:clamp(8px,3cqmin,24px)">
          <span style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(26px,{{ dayK }}cqmin,160px);line-height:.9;color:{{ ink }}">{{ day }}</span>
          <span style="display:flex;flex-direction:column;gap:2px;padding-inline-start:clamp(8px,3cqmin,24px);border-inline-start:clamp(1px,.45cqmin,3px) solid {{ line }}"><b style="font-size:clamp(12px,4.6cqmin,36px);line-height:1.1">{{ monthYear }}</b><span style="font-size:clamp(10.5px,3.5cqmin,26px);color:#3a4a4c;line-height:1.25">{{ weekTime }}</span></span>
        </div></sc-if>
        <span style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(15px,{{ titleK }}cqmin,96px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:{{ lines }};-webkit-box-orient:vertical;overflow:hidden">{{ title }}</span>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:clamp(2px,1cqmin,10px)">
          <span style="min-width:0;font-size:clamp(10.5px,3.8cqmin,28px);color:#3a4a4c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ metaLine }}</span>
          <span style="flex:none;display:flex;align-items:center;gap:clamp(4px,1.4cqmin,12px)"><img src="assets/logo-mark.png" alt="" style="width:clamp(16px,6cqmin,46px);height:clamp(16px,6cqmin,46px);border-radius:clamp(4px,1.4cqmin,10px);background:#fff;padding:2px;box-sizing:border-box;object-fit:contain"><span style="display:flex;flex-direction:column;line-height:1"><b style="font-family:'Playfair Display',Georgia,serif;font-size:clamp(10px,3.4cqmin,26px)">Africa</b><span style="font-size:clamp(6.5px,1.9cqmin,14px);font-weight:700;letter-spacing:.26em;color:#237b22">GATES</span></span></span>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isBanner }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;gap:clamp(12px,7cqmin,64px);padding:0 clamp(14px,10cqmin,96px)">
      <sc-if value="{{ hasDate }}" hint-placeholder-val="{{ false }}"><div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding-inline-end:clamp(12px,7cqmin,56px);border-inline-end:clamp(1px,.6cqmin,3px) solid {{ line }}"><span style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(26px,34cqmin,180px);line-height:.9;color:{{ ink }}">{{ day }}</span><b style="font-size:clamp(11px,8cqmin,36px)">{{ monthShort }}</b></div></sc-if>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(4px,3cqmin,16px)">
        <span style="align-self:flex-start;display:flex;align-items:center;gap:7px;height:clamp(20px,12cqmin,44px);padding:0 clamp(8px,4cqmin,18px);border-radius:999px;background:#fff;color:{{ ink }};font-weight:700;font-size:clamp(11px,5.4cqmin,18px);white-space:nowrap"><span style="width:clamp(5px,2.2cqmin,9px);aspect-ratio:1 / 1;border-radius:50%;background:{{ line }}"></span>{{ label }}</span>
        <span style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-size:clamp(15px,{{ titleK }}cqmin,80px);line-height:1.08;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ title }}</span>
        <span style="font-size:clamp(11px,6cqmin,24px);color:#3a4a4c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ bannerMeta }}</span>
      </div>
      <sc-if value="{{ showBannerMark }}" hint-placeholder-val="{{ true }}"><span style="flex:none;width:clamp(36px,30cqmin,140px);aspect-ratio:1 / 1;border-radius:clamp(9px,7cqmin,30px);background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -14px rgba(16,41,44,.35)"><sc-if value="{{ hasHostLogo }}" hint-placeholder-val="{{ false }}"><img src="{{ logo }}" alt="" style="width:64%;height:64%;object-fit:contain"></sc-if><sc-if value="{{ noHostLogo }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="{{ ink }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:44%;height:44%;overflow:visible"><path d="{{ glyph }}"></path></svg></sc-if></span></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:360},&quot;subject&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;event&quot;,&quot;award&quot;,&quot;campaign&quot;,&quot;blog&quot;,&quot;challenge&quot;,&quot;product&quot;],&quot;default&quot;:&quot;event&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ceremony&quot;,&quot;gala&quot;,&quot;conference&quot;,&quot;workshop&quot;,&quot;training&quot;,&quot;webinar&quot;,&quot;livestream&quot;,&quot;community&quot;,&quot;concert&quot;,&quot;sports&quot;,&quot;fundraiser&quot;,&quot;exhibition&quot;],&quot;default&quot;:&quot;ceremony&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;graphic&quot;,&quot;full&quot;],&quot;default&quot;:&quot;graphic&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;content&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;none&quot;,&quot;date&quot;,&quot;title&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;16 / 9&quot;,&quot;4 / 3&quot;,&quot;1 / 1&quot;,&quot;1.91 / 1&quot;,&quot;3 / 1&quot;,&quot;4 / 5&quot;],&quot;default&quot;:&quot;16 / 9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;green&quot;,&quot;gold&quot;,&quot;live&quot;,&quot;info&quot;,&quot;stone&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ltr&quot;,&quot;rtl&quot;],&quot;default&quot;:&quot;ltr&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ratio&quot;,&quot;fill&quot;],&quot;default&quot;:&quot;ratio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kenya Creative Economy Awards · 11th Edition ceremony&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-12-06&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:00 EAT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;place&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;KICC, Nairobi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;host&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nairobi Creative Assembly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

function pat(p,a,b,X){

class Component extends DCLogic {

    const X=v=>rtl?100-v:v, ratio=p.ratio ?? '16 / 9', w=S.w||640, ar=(S.w&&S.hh)?S.w/S.hh:parseRatio(ratio), minSide=Math.min(w,S.hh||w/ar);

      pattern:pat(def[2],a,b,X), mask,

      pillX:'clamp(8px,6cqmin,24px)', pillTop:showTitle?'clamp(8px,6cqmin,24px)':'auto', pillBottom:showTitle?'auto':'clamp(8px,6cqmin,24px)',
      gTitleK:len<=28?11:len<=56?9:7.6,
