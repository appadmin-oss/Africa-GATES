<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</helmet>

<span role="img" aria-label="{{ aria }}" style="position:relative;display:inline-flex;flex:none;width:{{ s }};height:{{ s }};vertical-align:middle;font-family:'DM Sans',system-ui,sans-serif">
  <span style="position:absolute;inset:0;border-radius:{{ rad }};overflow:hidden;background:{{ bg }};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px {{ edge }}">
    <span aria-hidden="true" style="position:absolute;inset:0;background:{{ arc }}"></span>
    <span aria-hidden="true" style="position:relative;font-weight:700;font-size:{{ fs }};letter-spacing:{{ ls }};color:{{ ink }};line-height:1">{{ ini }}</span>
  </span>
  <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;right:{{ bOff }};bottom:{{ bOff }};width:{{ bs }};height:{{ bs }};border-radius:50%;background:{{ bBg }};color:{{ bFg }};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 {{ bRing }} {{ ringColor }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:60%;height:60%"><path d="{{ bGlyph }}"></path></svg></span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Amara Okonkwo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;person&quot;,&quot;organisation&quot;,&quot;business&quot;,&quot;government&quot;],&quot;default&quot;:&quot;person&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;min&quot;:20,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;verified&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#fff&quot;,&quot;options&quot;:[&quot;#fff&quot;,&quot;#f1efe9&quot;,&quot;#fbfbfa&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const T=[['#effaf0','#cfe6ce','#1a6118','#237b22'],['#fcf4de','#f0dfae','#7a5600','#c99a06'],['#fdecef','#f6c7d3','#b0224f','#e0245e'],['#e6f0f4','#c9dde8','#1f5f8b','#1f6fa3'],['#f1efe9','#d6d4cc','#10292c','#3a4a4c']];
const STOP=new Set(['of','the','and','&','for','de','du','la','le','des','et','da','do','dos','das','e','y','al','el']);
const G={organisation:'M4 21V5l8-2v18M12 21h8V9l-8-2M8 8h.01M8 12h.01M8 16h.01M16 12h.01M16 16h.01',business:'M4 8h16v11H4zM9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 13h16',government:'M3 21h18M5 18h14M6 10v8M10 10v8M14 10v8M18 10v8M12 3 3 8h18z',verified:'M5 12.5 10 17 19 7'};
const crc=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);};
class Component extends DCLogic {
  renderVals(){
    const p=this.props, name=String(p.label ?? p.name ?? 'Amara Okonkwo').trim(), kind=p.kind ?? 'person', size=Math.max(20,+(p.size ?? 56)), ver=!!p.verified;
    const t=T[crc(String(p.id ?? name))%T.length];
    const words=name.split(/\s+/).filter(w=>w&&!STOP.has(w.toLowerCase())&&/\p{L}/u.test(w));
    const letters=(words.length?words:[name]).map(w=>[...w.replace(/[^\p{L}\p{N}]/gu,'')][0]||'').filter(Boolean);
    const one=size<=32||letters.length<2, ini=(one?letters.slice(0,1):letters.slice(0,2)).join('').toLocaleUpperCase();
    const person=kind==='person', badge=size>=40&&(ver||!person), bs=Math.max(16,Math.round(size*.36));
    return {
      s:size+'px', rad:person?'50%':Math.round(size*.28)+'px', bg:`linear-gradient(150deg, ${t[0]} 0%, ${t[0]} 45%, ${t[1]} 100%)`, edge:t[1], ink:t[2],
      arc:size<40?'none':`radial-gradient(circle at 100% 100%, transparent 0 38%, ${t[3]}26 38% 40.5%, transparent 40.5% 56%, ${t[3]}18 56% 58.5%, transparent 58.5%)`,
      fs:Math.round(size*(one?.46:.38))+'px', ls:one?'0':'-.02em', ini:ini||'?',
      hasBadge:badge, bs:bs+'px', bOff:person?'-1px':Math.round(-bs*.22)+'px', bRing:Math.max(2,Math.round(size/40))+'px', ringColor:p.ring ?? '#fff',
      bBg:ver?'#1f6fa3':'#fff', bFg:ver?'#fff':'#10292c', bGlyph:ver?G.verified:(G[kind]||G.organisation),
      aria:name+(person?'':', '+kind)+(ver?', verified':'')
    };
  }
}
</script>
</body>
</html>
