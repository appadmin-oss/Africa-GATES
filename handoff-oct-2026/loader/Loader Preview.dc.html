<style>
html,body{margin:0;height:100%}
@keyframes lgDisc{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(50% at 50% 50%)}}

@keyframes lgBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lgOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes lgPanel{to{opacity:0}}
</style>
</helmet>
